<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متجر عكس | Aks Store</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --panel: #151519;
      --panel-2: #1c1c22;
      --border: #2b2b34;
      --gold: #f5d061;
      --gold-dim: rgba(245, 208, 97, 0.14);
      --text: #f5f5f7;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 16px 60px;
      background: radial-gradient(circle at top, #1f1a10 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .app {
      max-width: 920px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 22px;
      margin-bottom: 20px;
    }
    .brand h1 {
      margin: 0;
      font-size: 24px;
      color: var(--gold);
      font-weight: 800;
    }
    .brand p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }
    .btn {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.15s ease;
    }
    .btn:hover { border-color: var(--gold); }
    .btn-gold {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
    }
    .btn-gold:hover { filter: brightness(1.05); }

    .categories {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .cat-btn {
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--gold-dim);
      border-color: var(--gold);
      color: var(--gold);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 16px;
    }
    .product-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top-price-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--gold-dim);
      border: 1px solid rgba(245, 208, 97, 0.45);
      color: var(--gold);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
    }
    .top-price-value {
      font-size: 15px;
      font-weight: 900;
    }
    .product-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 12px;
      background: #0f0f13;
      border: 1px solid #24242c;
    }
    .product-title {
      font-size: 16px;
      font-weight: 800;
    }
    .option-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-btn {
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .mode-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      background: var(--gold-dim);
    }
    .pieces-box {
      display: none;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }
    .pieces-box.show { display: block; }
    .pieces-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 6px;
    }
    .piece-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      cursor: pointer;
      background: #121216;
      text-align: center;
    }
    .piece-item.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px var(--gold);
    }
    .piece-item img {
      width: 100%;
      height: 46px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
    .piece-item span {
      display: block;
      font-size: 11px;
      margin-top: 3px;
      color: var(--text);
    }
    .qty-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .qty-ctrl {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel-2);
    }
    .qty-ctrl button {
      width: 32px;
      height: 32px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .qty-ctrl span {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
    }

    .cart-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: none;
      justify-content: flex-end;
      z-index: 50;
    }
    .cart-backdrop.open { display: flex; }
    .cart-panel {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      gap: 16px;
    }
    .cart-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .field {
      width: 100%;
      background: #0f0f13;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 8px;
      font-family: inherit;
    }
    .field:focus {
      outline: none;
      border-color: var(--gold);
    }
    .receipt {
      display: none;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.45);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.7;
      margin-top: 10px;
      white-space: pre-line;
    }
    .receipt.show { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>متجر عكس</h1>
        <p>Aks Store</p>
      </div>
      <button class="btn btn-gold" onclick="toggleCart(true)">
        السلة (<span id="cart-count">0</span>)
      </button>
    </header>

    <div class="categories">
      <button class="cat-btn active" data-cat="car" onclick="setCategory('car', this)">استكرات سيارة</button>
      <button class="cat-btn" data-cat="phone" onclick="setCategory('phone', this)">استكرات جوال</button>
    </div>

    <div id="products-grid" class="grid"></div>
  </div>

  <div id="cart-backdrop" class="cart-backdrop" onclick="if(event.target===this) toggleCart(false)">
    <div class="cart-panel">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h2 style="margin:0;font-size:18px;color:var(--gold);">سلة متجر عكس</h2>
          <button class="btn" onclick="toggleCart(false)">إغلاق</button>
        </div>
        <div id="cart-items"></div>
      </div>

      <div style="border-top:1px solid var(--border);padding-top:14px;">
        <div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:12px;">
          <span>الإجمالي:</span>
          <span style="color:var(--gold);"><span id="cart-total">0</span></span>
        </div>

        <input id="cust-name" class="field" type="text" placeholder="الاسم" />
        <input id="cust-phone" class="field" type="text" placeholder="رقم الجوال / التواصل" />
        <input id="cust-note" class="field" type="text" placeholder="ملاحظة الطلب (اختياري)" />

        <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="submitStoreOrder()">
          تأكيد الطلب
        </button>

        <div id="order-receipt" class="receipt"></div>
      </div>
    </div>
  </div>

  <script>
    const PRICE_EACH = 8;

    const products = [
      {
        id: 'car-1',
        cat: 'car',
        name: 'مجموعة استكرات سيارة 1',
        image: 'download (7).jpg',
        pieces: [
          { name: 'حبة 1', img: 'download (7).jpg' },
          { name: 'حبة 2', img: '934285885220675566.jpg' },
          { name: 'حبة 3', img: '1088815647439205982.jpg' },
          { name: 'حبة 4', img: '1131810950115823355.jpg' }
        ]
      },
      {
        id: 'car-2',
        cat: 'car',
        name: 'مجموعة استكرات سيارة 2',
        image: 'Funky Cool stickers.jpg',
        pieces: [
          { name: 'حبة 1', img: 'Funky Cool stickers.jpg' },
          { name: 'حبة 2', img: '1001276929671431993.jpg' },
          { name: 'حبة 3', img: '932385929125474821.jpg' },
          { name: 'حبة 4', img: '1085789791430201338.jpg' }
        ]
      },
      {
        id: 'phone-1',
        cat: 'phone',
        name: 'مجموعة استكرات جوال 1',
        image: '934285885220675566.jpg',
        pieces: [
          { name: 'حبة 1', img: '934285885220675566.jpg' },
          { name: 'حبة 2', img: '1088815647439205982.jpg' },
          { name: 'حبة 3', img: '1131810950115823355.jpg' },
          { name: 'حبة 4', img: 'download (7).jpg' }
        ]
      },
      {
        id: 'phone-2',
        cat: 'phone',
        name: 'مجموعة استكرات جوال 2',
        image: '1001276929671431993.jpg',
        pieces: [
          { name: 'حبة 1', img: '1001276929671431993.jpg' },
          { name: 'حبة 2', img: '932385929125474821.jpg' },
          { name: 'حبة 3', img: 'Funky Cool stickers.jpg' },
          { name: 'حبة 4', img: '1085789791430201338.jpg' }
        ]
      }
    ];

    let activeCat = 'car';
    const cardState = {};
    const cart = [];

    products.forEach(p => {
      cardState[p.id] = {
        mode: 'pack',
        pieceIdx: 0,
        qty: 1
      };
    });

    function setCategory(cat, btn) {
      activeCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function setMode(id, mode) {
      cardState[id].mode = mode;
      renderProducts();
    }

    function selectPiece(id, idx) {
      cardState[id].pieceIdx = idx;
      renderProducts();
    }

    function changeCardQty(id, delta) {
      cardState[id].qty = Math.max(1, cardState[id].qty + delta);
      renderProducts();
    }

    function addToCart(id) {
      const p = products.find(item => item.id === id);
      const st = cardState[id];
      const modeLabel = st.mode === 'pack' ? 'باكج' : `حبات (${p.pieces[st.pieceIdx].name})`;
      const previewImg = st.mode === 'pack' ? p.image : p.pieces[st.pieceIdx].img;

      const existing = cart.find(c => c.id === id && c.modeLabel === modeLabel);
      if (existing) {
        existing.qty += st.qty;
      } else {
        cart.push({
          id,
          title: p.name,
          modeLabel,
          price: PRICE_EACH,
          qty: st.qty,
          img: previewImg
        });
      }
      document.getElementById('order-receipt').classList.remove('show');
      renderCart();
      toggleCart(true);
    }

    function updateCartQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      const filtered = products.filter(p => p.cat === activeCat);

      grid.innerHTML = filtered.map(p => {
        const st = cardState[p.id];
        const activeImg = st.mode === 'pack' ? p.image : p.pieces[st.pieceIdx].img;

        return `
          <div class="product-card">
            <div class="top-price-bar">
              <span>السعر</span>
              <span class="top-price-value">${PRICE_EACH}</span>
            </div>

            <img class="product-img" src="${activeImg}" alt="${p.name}" onerror="this.style.opacity='0.35'" />
            <div class="product-title">${p.name}</div>

            <div>
              <span class="option-label">نوع الشراء:</span>
              <div class="mode-switch">
                <button class="mode-btn ${st.mode === 'pack' ? 'active' : ''}" onclick="setMode('${p.id}', 'pack')">باكج</button>
                <button class="mode-btn ${st.mode === 'single' ? 'active' : ''}" onclick="setMode('${p.id}', 'single')">حبات</button>
              </div>
            </div>

            <div class="pieces-box ${st.mode === 'single' ? 'show' : ''}">
              <span class="option-label">اختر الحبة:</span>
              <div class="pieces-grid">
                ${p.pieces.map((pc, idx) => `
                  <div class="piece-item ${st.pieceIdx === idx ? 'selected' : ''}" onclick="selectPiece('${p.id}', ${idx})">
                    <img src="${pc.img}" alt="${pc.name}" />
                    <span>${pc.name}</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="qty-row">
              <span class="option-label" style="margin:0;">الكمية:</span>
              <div class="qty-ctrl">
                <button onclick="changeCardQty('${p.id}', -1)">-</button>
                <span>${st.qty}</span>
                <button onclick="changeCardQty('${p.id}', 1)">+</button>
              </div>
            </div>

            <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="addToCart('${p.id}')">
              إضافة للسلة (${PRICE_EACH * st.qty})
            </button>
          </div>
        `;
      }).join('');
    }

    function renderCart() {
      const list = document.getElementById('cart-items');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');

      const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalPrice = cart.reduce((acc, item) => acc + item.qty * item.price, 0);

      countEl.textContent = totalQty;
      totalEl.textContent = totalPrice;

      if (!cart.length) {
        list.innerHTML = '<p style="color:var(--muted);font-size:14px;">السلة فاضية حالياً.</p>';
        return;
      }

      list.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${item.img}" alt="${item.title}" style="width:46px;height:46px;border-radius:8px;object-fit:cover;" />
            <div>
              <div style="font-weight:700;font-size:14px;">${item.title}</div>
              <div style="color:var(--muted);font-size:12px;">${item.modeLabel} — ${item.price} لكل واحد</div>
            </div>
          </div>
          <div class="qty-ctrl">
            <button onclick="updateCartQty(${idx}, -1)">-</button>
            <span>${item.qty}</span>
            <button onclick="updateCartQty(${idx}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart(open) {
      document.getElementById('cart-backdrop').classList.toggle('open', open);
    }

    function submitStoreOrder() {
      const receipt = document.getElementById('order-receipt');
      if (!cart.length) {
        receipt.textContent = 'السلة فاضية، أضف استكرات أولاً.';
        receipt.classList.add('show');
        return;
      }
      const name = document.getElementById('cust-name').value.trim() || 'عميل';
      const phone = document.getElementById('cust-phone').value.trim() || 'غير محدد';
      const note = document.getElementById('cust-note').value.trim();
      const orderNum = 'AKS-' + Math.floor(1000 + Math.random() * 9000);
      const total = cart.reduce((acc, item) => acc + item.qty * item.price, 0);
      const itemsText = cart.map((c, i) => `${i + 1}. ${c.title} (${c.modeLabel}) × ${c.qty} = ${c.qty * c.price}`).join('\n');

      receipt.textContent =
        `تم تسجيل الطلب بنجاح — رقم الطلب: ${orderNum}\n` +
        `الاسم: ${name}\n` +
        `التواصل: ${phone}\n` +
        (note ? `ملاحظة: ${note}\n` : '') +
        `المنتجات:\n${itemsText}\n` +
        `الإجمالي: ${total}`;
      receipt.classList.add('show');
    }

    renderProducts();
    renderCart();
  </script>
</body>
</html>
